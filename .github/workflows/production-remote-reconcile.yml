name: Production Remote Reconcile

'on':
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full or short SHA expected in the current production release
        required: true
        type: string
      case_id:
        description: RemoteReconcileCase UUID
        required: true
        type: string
      apply:
        description: Apply the previewed authoritative evidence
        required: true
        default: false
        type: boolean
      evidence_source:
        description: Authoritative evidence source
        required: true
        default: journal
        type: choice
        options:
          - journal
          - telegram-history
          - membership-probe
      expected_evidence_fingerprint:
        description: Exact preview fingerprint; required for apply
        required: false
        default: ''
        type: string
      resolve_conflict:
        description: Resolve an audited state-hash conflict using current hashes
        required: true
        default: false
        type: boolean
      accept_fresh_conflict_evidence:
        description: Accept fresh approved evidence after a conflict state
        required: true
        default: false
        type: boolean
      expected_action_state_hash:
        description: Current action state hash; required for conflict resolution
        required: false
        default: ''
        type: string
      expected_attempt_state_hash:
        description: Current attempt state hash; required for conflict resolution
        required: false
        default: ''
        type: string
      expected_conflict_evidence_hash:
        description: Existing conflict evidence hash; required for fresh conflict evidence
        required: false
        default: ''
        type: string
      actor:
        description: Approved operator identity
        required: true
        type: string
      approval_ref:
        description: Approval or incident reference without spaces
        required: true
        type: string

concurrency:
  group: production-remote-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production-silicon-valley
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          CASE_ID: ${{ inputs.case_id }}
          APPLY: ${{ inputs.apply }}
          EVIDENCE_SOURCE: ${{ inputs.evidence_source }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_evidence_fingerprint }}
          RESOLVE_CONFLICT: ${{ inputs.resolve_conflict }}
          ACCEPT_FRESH_CONFLICT_EVIDENCE: ${{ inputs.accept_fresh_conflict_evidence }}
          EXPECTED_ACTION_HASH: ${{ inputs.expected_action_state_hash }}
          EXPECTED_ATTEMPT_HASH: ${{ inputs.expected_attempt_state_hash }}
          EXPECTED_CONFLICT_EVIDENCE_HASH: ${{ inputs.expected_conflict_evidence_hash }}
          ACTOR: ${{ inputs.actor }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          [[ "${EXPECTED_DEPLOYED_SHA}" =~ ^[0-9a-fA-F]{8,40}$ ]]
          [[ "${CASE_ID}" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "${ACTOR}" =~ ^[A-Za-z0-9._@+-]{1,100}$ ]]
          [[ "${APPROVAL_REF}" =~ ^[A-Za-z0-9._:/#-]{1,160}$ ]]
          [[ "${EVIDENCE_SOURCE}" == journal || "${EVIDENCE_SOURCE}" == telegram-history || "${EVIDENCE_SOURCE}" == membership-probe ]]
          if [[ "${APPLY}" == true ]]; then
            [[ "${EXPECTED_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]
          else
            test -z "${EXPECTED_FINGERPRINT}" || [[ "${EXPECTED_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]
          fi
          if [[ "${RESOLVE_CONFLICT}" == true ]]; then
            [[ "${APPLY}" == true ]]
            [[ "${EXPECTED_ACTION_HASH}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${EXPECTED_ATTEMPT_HASH}" =~ ^[0-9a-f]{64}$ ]]
          fi
          if [[ "${ACCEPT_FRESH_CONFLICT_EVIDENCE}" == true ]]; then
            [[ "${RESOLVE_CONFLICT}" == true ]]
            [[ "${APPLY}" == true ]]
            [[ "${EXPECTED_CONFLICT_EVIDENCE_HASH}" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          CONNECT_TIMEOUT="${SSH_CONNECT_TIMEOUT:-60}"
          cat > ~/.ssh/config <<EOF
          Host silicon-valley-production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${CONNECT_TIMEOUT}
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify deployed release and runtime
        env:
          PRODUCTION_BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tgyunying}"
          EXPECTED_SHA="${EXPECTED_DEPLOYED_SHA:0:8}"
          CURRENT_RELEASE="$(ssh silicon-valley-production-server "readlink -f '${BASE_DIR}/current'")"
          CURRENT_NAME="$(basename "${CURRENT_RELEASE}")"
          echo "PRODUCTION_REMOTE_RECONCILE_RELEASE=${CURRENT_RELEASE}"
          case "${CURRENT_NAME}" in
            *_"${EXPECTED_SHA}") ;;
            *) echo "deployed release SHA does not match workflow SHA" >&2; exit 1 ;;
          esac
          ssh silicon-valley-production-server '
            set -euo pipefail
            for name in tgyunying-backend tgyunying-worker-recovery
            do
              state="$(docker inspect --format "{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "${name}")"
              echo "PRODUCTION_REMOTE_RECONCILE_CONTAINER=${name}:${state}"
              [[ "${state}" == running/healthy ]]
            done
          '

      - name: Preview or apply remote evidence
        env:
          CASE_ID: ${{ inputs.case_id }}
          APPLY: ${{ inputs.apply }}
          EVIDENCE_SOURCE: ${{ inputs.evidence_source }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_evidence_fingerprint }}
          RESOLVE_CONFLICT: ${{ inputs.resolve_conflict }}
          ACCEPT_FRESH_CONFLICT_EVIDENCE: ${{ inputs.accept_fresh_conflict_evidence }}
          EXPECTED_ACTION_HASH: ${{ inputs.expected_action_state_hash }}
          EXPECTED_ATTEMPT_HASH: ${{ inputs.expected_attempt_state_hash }}
          EXPECTED_CONFLICT_EVIDENCE_HASH: ${{ inputs.expected_conflict_evidence_hash }}
          ACTOR: ${{ inputs.actor }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          if [[ "${APPLY}" == true ]]; then
            if [[ "${RESOLVE_CONFLICT}" == true && "${ACCEPT_FRESH_CONFLICT_EVIDENCE}" == true ]]; then
              RESULT="$(ssh silicon-valley-production-server "timeout 180 docker exec -i tgyunying-backend python -m scripts.reconcile_remote_delivery apply --case-id '${CASE_ID}' --evidence-source '${EVIDENCE_SOURCE}' --expected-evidence-fingerprint '${EXPECTED_FINGERPRINT}' --actor '${ACTOR}' --approval-ref '${APPROVAL_REF}' --resolve-conflict --accept-fresh-conflict-evidence --expected-action-state-hash '${EXPECTED_ACTION_HASH}' --expected-attempt-state-hash '${EXPECTED_ATTEMPT_HASH}' --expected-conflict-evidence-hash '${EXPECTED_CONFLICT_EVIDENCE_HASH}'")"
            elif [[ "${RESOLVE_CONFLICT}" == true ]]; then
              RESULT="$(ssh silicon-valley-production-server "timeout 180 docker exec -i tgyunying-backend python -m scripts.reconcile_remote_delivery apply --case-id '${CASE_ID}' --evidence-source '${EVIDENCE_SOURCE}' --expected-evidence-fingerprint '${EXPECTED_FINGERPRINT}' --actor '${ACTOR}' --approval-ref '${APPROVAL_REF}' --resolve-conflict --expected-action-state-hash '${EXPECTED_ACTION_HASH}' --expected-attempt-state-hash '${EXPECTED_ATTEMPT_HASH}'")"
            else
              RESULT="$(ssh silicon-valley-production-server "timeout 180 docker exec -i tgyunying-backend python -m scripts.reconcile_remote_delivery apply --case-id '${CASE_ID}' --evidence-source '${EVIDENCE_SOURCE}' --expected-evidence-fingerprint '${EXPECTED_FINGERPRINT}' --actor '${ACTOR}' --approval-ref '${APPROVAL_REF}'")"
            fi
            printf '%s\n' "${RESULT}"
            STATE="$(printf '%s\n' "${RESULT}" | tail -n 1 | jq -r '.state')"
            [[ "${STATE}" == remote_confirmed || "${STATE}" == remote_absence_proven ]]
          else
            ssh silicon-valley-production-server "timeout 180 docker exec -i tgyunying-backend python -m scripts.reconcile_remote_delivery preview --case-id '${CASE_ID}' --evidence-source '${EVIDENCE_SOURCE}'"
          fi
