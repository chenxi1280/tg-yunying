name: Production Task Monitor

'on':
  workflow_dispatch:
    inputs:
      release_live_at:
        description: Beijing-time release anchor used for post-release facts
        required: true
        type: string
      deployed_sha:
        description: Full or short SHA expected in the current production release
        required: true
        type: string
      task_ids:
        description: Comma-separated incident task IDs
        required: false
        default: d3365706-afe1-4166-9d0d-c2d6404bc8ad,84180c47-cf92-408e-bdd9-c68804f7de29,7805d8f2-dfef-4842-b11c-14cc1f434c94,fdb48029-4fda-4801-818d-0c509da37ea3,3e9db16a-ff5a-4b19-b917-c0182b16734a
        type: string
      recover_stale_search_assignments:
        description: Preview or apply stale search-click Assignment release
        required: true
        default: false
        type: boolean
      stale_assignment_apply:
        description: Apply the fingerprint-locked stale Assignment release
        required: true
        default: false
        type: boolean
      stale_assignment_expected_count:
        description: Exact stale count from preview; required for apply
        required: false
        default: ''
        type: string
      stale_assignment_expected_releasable_count:
        description: Exact releasable count from preview; required for apply
        required: false
        default: ''
        type: string
      stale_assignment_expected_fingerprint:
        description: Exact candidate fingerprint from preview; required for apply
        required: false
        default: ''
        type: string
      stale_assignment_actor:
        description: Approved production operator identity
        required: false
        default: codex
        type: string
      stale_assignment_approval_ref:
        description: Approval or incident reference without spaces
        required: false
        default: ''
        type: string

concurrency:
  group: production-task-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: production-silicon-valley
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate monitor inputs and secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          RELEASE_LIVE_AT: ${{ inputs.release_live_at }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          RECOVERY_ENABLED: ${{ inputs.recover_stale_search_assignments }}
          RECOVERY_APPLY: ${{ inputs.stale_assignment_apply }}
          RECOVERY_TASK_IDS: ${{ inputs.task_ids }}
          RECOVERY_EXPECTED_COUNT: ${{ inputs.stale_assignment_expected_count }}
          RECOVERY_EXPECTED_RELEASABLE_COUNT: ${{ inputs.stale_assignment_expected_releasable_count }}
          RECOVERY_EXPECTED_FINGERPRINT: ${{ inputs.stale_assignment_expected_fingerprint }}
          RECOVERY_ACTOR: ${{ inputs.stale_assignment_actor }}
          RECOVERY_APPROVAL_REF: ${{ inputs.stale_assignment_approval_ref }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${RELEASE_LIVE_AT}"
          [[ "${EXPECTED_DEPLOYED_SHA}" =~ ^[0-9a-fA-F]{8,40}$ ]]
          if [[ "${RECOVERY_ENABLED}" == true ]]; then
            [[ "${RECOVERY_TASK_IDS}" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "${RECOVERY_ACTOR}" =~ ^[A-Za-z0-9._@+-]{1,100}$ ]]
            [[ "${RECOVERY_APPROVAL_REF}" =~ ^[A-Za-z0-9._:/#-]{1,160}$ ]]
          fi
          if [[ "${RECOVERY_APPLY}" == true ]]; then
            [[ "${RECOVERY_ENABLED}" == true ]]
            [[ "${RECOVERY_EXPECTED_COUNT}" =~ ^[0-9]+$ ]]
            [[ "${RECOVERY_EXPECTED_RELEASABLE_COUNT}" =~ ^[0-9]+$ ]]
            [[ "${RECOVERY_EXPECTED_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          CONNECT_TIMEOUT="${SSH_CONNECT_TIMEOUT:-60}"
          cat > ~/.ssh/config <<EOF
          Host silicon-valley-production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${CONNECT_TIMEOUT}
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify deployed release and runtime without mutation
        env:
          PRODUCTION_BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tgyunying}"
          EXPECTED_SHA="${EXPECTED_DEPLOYED_SHA:0:8}"
          CURRENT_RELEASE="$(ssh silicon-valley-production-server "readlink -f '${BASE_DIR}/current'")"
          CURRENT_NAME="$(basename "${CURRENT_RELEASE}")"
          echo "PRODUCTION_MONITOR_RELEASE=${CURRENT_RELEASE}"
          case "${CURRENT_NAME}" in
            *_"${EXPECTED_SHA}") ;;
            *) echo "deployed release SHA does not match workflow SHA" >&2; exit 1 ;;
          esac
          ssh silicon-valley-production-server '
            set -euo pipefail
            for name in \
              tgyunying-backend \
              tgyunying-worker-dispatcher-1 \
              tgyunying-worker-dispatcher-2 \
              tgyunying-worker-ai-generation \
              tgyunying-worker-ai-generation-2 \
              tgyunying-worker-ai-generation-3
            do
              state="$(docker inspect --format "{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "${name}")"
              echo "PRODUCTION_MONITOR_CONTAINER=${name}:${state}"
              [[ "${state}" == running/healthy ]]
            done
          '

      - name: Recover stale search click assignments
        if: ${{ inputs.recover_stale_search_assignments }}
        env:
          TASK_ID: ${{ inputs.task_ids }}
          APPLY: ${{ inputs.stale_assignment_apply }}
          EXPECTED_COUNT: ${{ inputs.stale_assignment_expected_count }}
          EXPECTED_RELEASABLE_COUNT: ${{ inputs.stale_assignment_expected_releasable_count }}
          EXPECTED_FINGERPRINT: ${{ inputs.stale_assignment_expected_fingerprint }}
          ACTOR: ${{ inputs.stale_assignment_actor }}
          APPROVAL_REF: ${{ inputs.stale_assignment_approval_ref }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server "timeout 240 docker exec \
            -e STALE_RECOVERY_TASK_ID='${TASK_ID}' \
            -e STALE_RECOVERY_APPLY='${APPLY}' \
            -e STALE_RECOVERY_EXPECTED_STALE_COUNT='${EXPECTED_COUNT}' \
            -e STALE_RECOVERY_EXPECTED_RELEASABLE_COUNT='${EXPECTED_RELEASABLE_COUNT}' \
            -e STALE_RECOVERY_EXPECTED_FINGERPRINT='${EXPECTED_FINGERPRINT}' \
            -e STALE_RECOVERY_ACTOR='${ACTOR}' \
            -e STALE_RECOVERY_APPROVAL_REF='${APPROVAL_REF}' \
            -i tgyunying-backend python -" \
            < .github/scripts/recover_stale_search_click_assignments.py

      - name: Read incident task fulfillment E4 facts
        env:
          RELEASE_LIVE_AT: ${{ inputs.release_live_at }}
          TASK_IDS: ${{ inputs.task_ids }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server "timeout 180 docker exec \
            -e TASK_FULFILLMENT_RELEASE_LIVE_AT='${RELEASE_LIVE_AT}' \
            -e TASK_FULFILLMENT_E4_TASK_IDS='${TASK_IDS}' \
            -i tgyunying-backend python -" \
            < .github/scripts/task_fulfillment_e4_diagnostics.py

      - name: Read search click recent solver epochs
        if: ${{ always() }}
        env:
          SEARCH_CLICK_DIAGNOSTIC_TASK_IDS: ${{ inputs.task_ids }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server "timeout 180 docker exec \
            -e SEARCH_CLICK_DIAGNOSTIC_TASK_IDS='${SEARCH_CLICK_DIAGNOSTIC_TASK_IDS}' \
            -i tgyunying-backend python -" \
            < .github/scripts/search_click_recent_epoch_diagnostics.py

      - name: Read search proxy runtime
        if: ${{ always() }}
        env:
          SEARCH_PROXY_TASK_IDS: ${{ inputs.task_ids }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server \
            "docker ps --format '{{.Names}} {{.Status}}' | grep '^tgyunying-mihomo-' || true"
          ssh silicon-valley-production-server '
            set -euo pipefail
            for name in $(docker ps --format "{{.Names}}" | grep "^tgyunying-mihomo-"); do
              if timeout 15 docker exec tgyunying-backend curl -fsS --max-time 10 \
                -x "socks5h://${name}:7890" https://api.ipify.org >/dev/null; then
                echo "SEARCH_PROXY_EGRESS=${name}:ok"
              else
                echo "SEARCH_PROXY_EGRESS=${name}:failed"
              fi
            done
          '
          ssh silicon-valley-production-server "timeout 180 docker exec \
            -e SEARCH_PROXY_TASK_IDS='${SEARCH_PROXY_TASK_IDS}' \
            -i tgyunying-backend python -" \
            < .github/scripts/search_proxy_runtime_diagnostics.py

      - name: Diagnose search proxy transport layers
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server '
            set -uo pipefail
            probe() {
              label="$1"
              shift
              output=$(timeout 20 docker exec tgyunying-backend curl -sS \
                --connect-timeout 5 --max-time 12 -o /dev/null \
                -w "http=%{http_code} connect=%{time_connect} tls=%{time_appconnect}" \
                "$@" 2>&1)
              rc=$?
              detail=$(printf "%s" "${output}" | tr "\n" " " | cut -c1-240)
              echo "SEARCH_PROXY_TRANSPORT=${label}:rc=${rc}:${detail}"
            }
            probe direct:https https://api.ipify.org
            for name in tgyunying-mihomo-001 tgyunying-mihomo-004 \
              tgyunying-mihomo-008 tgyunying-mihomo-012 tgyunying-mihomo-016; do
              probe "${name}:http" -x "socks5h://${name}:7890" \
                http://cp.cloudflare.com/generate_204
              probe "${name}:https" -x "socks5h://${name}:7890" \
                https://api.ipify.org
            done
          '

      - name: Diagnose proxy airport sync failure
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server '
            docker logs --since 30m tgyunying-backend 2>&1 \
              | grep -E -B 4 -A 30 "proxy-airport-subscriptions|Traceback|IntegrityError|ForeignKeyViolation|Internal Server Error" \
              | sed -E "s#https?://[^[:space:]]+#https://[redacted]#g" \
              | tail -n 320 || true
          '
          ssh silicon-valley-production-server \
            'timeout 120 docker exec -i tgyunying-backend python -' \
            < .github/scripts/diagnose_proxy_airport_sync.py

      - name: Read AI group binding diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server \
            'timeout 180 docker exec -i tgyunying-backend python -' \
            < .github/scripts/diagnose_ai_group_blockers.py \
            | jq -c '.tasks[] | {task, target, ledger, coverage, admissions, admission_actions, quantity_slots, actions, unknown_actions, bindings, content_mix}' \
            | sed 's/^/AI_GROUP_BINDING_DIAGNOSTICS=/'

      - name: Read AI scope mismatch diagnostics
        if: ${{ always() }}
        env:
          TASK_IDS: ${{ inputs.task_ids }}
        run: |
          set -euo pipefail
          ssh silicon-valley-production-server "timeout 180 docker exec \
            -e AI_SCOPE_TASK_IDS='${TASK_IDS}' \
            -i tgyunying-backend python -" \
            < .github/scripts/ai_scope_mismatch_diagnostics.py
