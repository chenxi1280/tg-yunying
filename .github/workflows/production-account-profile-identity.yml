name: Production Account Profile Identity Operations

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Guarded production operation
        required: true
        type: choice
        options:
          - profile_dedupe
          - avatar_import
          - login_batch_initialize
      mode:
        description: Read-only preview/readback or guarded apply
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - readback
      seed:
        description: Stable profile-name seed; required for profile_dedupe
        required: false
        default: ''
        type: string
      login_batch_ids:
        description: Comma-separated terminal login batch IDs; preview may leave empty for unique seven-day set discovery
        required: false
        default: ''
        type: string
      created_only_batch_ids:
        description: Batch IDs whose target scope is limited to same-transaction account creations
        required: false
        default: ''
        type: string
      expected_target_count:
        description: Exact successful account count expected from the login batch
        required: false
        default: '300'
        type: string
      style_group_ids:
        description: Comma-separated same-tenant group IDs; preview may leave empty for listener-group discovery
        required: false
        default: ''
        type: string
      deployed_sha:
        description: Exact deployed release SHA
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact preview manifest SHA-256; required for apply
        required: false
        default: ''
        type: string
      approval_ref:
        description: Approval or incident reference; required for apply
        required: false
        default: ''
        type: string

concurrency:
  group: production-account-profile-identity-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production-silicon-valley
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          OPERATION: ${{ inputs.operation }}
          MODE: ${{ inputs.mode }}
          SEED: ${{ inputs.seed }}
          LOGIN_BATCH_IDS: ${{ inputs.login_batch_ids }}
          CREATED_ONLY_BATCH_IDS: ${{ inputs.created_only_batch_ids }}
          EXPECTED_TARGET_COUNT: ${{ inputs.expected_target_count }}
          STYLE_GROUP_IDS: ${{ inputs.style_group_ids }}
          EXPECTED_SHA: ${{ inputs.deployed_sha }}
          MANIFEST_SHA: ${{ inputs.expected_manifest_sha256 }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          [[ "${OPERATION}" =~ ^(profile_dedupe|avatar_import|login_batch_initialize)$ ]]
          [[ "${MODE}" =~ ^(preview|apply|readback)$ ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${EXPECTED_SHA}" ]]
          [[ -z "${SEED}" || "${SEED}" =~ ^[A-Za-z0-9._-]{1,80}$ ]]
          [[ -z "${MANIFEST_SHA}" || "${MANIFEST_SHA}" =~ ^[0-9a-f]{64}$ ]]
          [[ -z "${APPROVAL_REF}" || "${APPROVAL_REF}" =~ ^[A-Za-z0-9._:/#-]{1,160}$ ]]
          if [[ "${OPERATION}" == profile_dedupe ]]; then
            test -n "${SEED}"
          fi
          if [[ "${OPERATION}" == login_batch_initialize ]]; then
            [[ -z "${LOGIN_BATCH_IDS}" || "${LOGIN_BATCH_IDS}" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
            [[ -z "${CREATED_ONLY_BATCH_IDS}" || "${CREATED_ONLY_BATCH_IDS}" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
            [[ "${EXPECTED_TARGET_COUNT}" =~ ^[1-9][0-9]*$ ]]
            [[ -z "${STYLE_GROUP_IDS}" || "${STYLE_GROUP_IDS}" =~ ^[0-9]+(,[0-9]+)*$ ]]
            [[ -z "${APPROVAL_REF}" || ${#APPROVAL_REF} -le 80 ]]
            test -n "${SEED}"
            if [[ "${MODE}" =~ ^(apply|readback)$ ]]; then
              test -n "${LOGIN_BATCH_IDS}"
              test -n "${STYLE_GROUP_IDS}"
            fi
          fi
          if [[ "${MODE}" =~ ^(apply|readback)$ ]]; then
            test -n "${MANIFEST_SHA}"
          fi
          if [[ "${MODE}" == apply ]]; then
            test -n "${APPROVAL_REF}"
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${SSH_CONNECT_TIMEOUT:-60}
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify deployed release
        env:
          BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          EXPECTED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          CURRENT="$(ssh production "readlink -f '${BASE_DIR:-/data/tgyunying}/current'")"
          [[ "$(basename "${CURRENT}")" == *_"${EXPECTED_SHA:0:8}" ]]
          echo "ACCOUNT_PROFILE_IDENTITY_RELEASE=${CURRENT}"
          ACCOUNT_SECURITY_STATE="$(ssh production 'docker inspect --format "{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" tgyunying-worker-account-security')"
          MATERIAL_CACHE_STATE="$(ssh production 'docker inspect --format "{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" tgyunying-worker-material-cache')"
          echo "ACCOUNT_PROFILE_IDENTITY_WORKER=tgyunying-worker-account-security:${ACCOUNT_SECURITY_STATE}"
          echo "ACCOUNT_AVATAR_MATERIAL_WORKER=tgyunying-worker-material-cache:${MATERIAL_CACHE_STATE}"
          ssh production \
            'docker logs --since 20m tgyunying-worker-material-cache 2>&1 | grep "material_cache_trace" | tail -80 || true' \
            | sed 's/^/ACCOUNT_AVATAR_MATERIAL_TRACE=/'

      - name: Run guarded operation
        env:
          OPERATION: ${{ inputs.operation }}
          MODE: ${{ inputs.mode }}
          SEED: ${{ inputs.seed }}
          LOGIN_BATCH_IDS: ${{ inputs.login_batch_ids }}
          CREATED_ONLY_BATCH_IDS: ${{ inputs.created_only_batch_ids }}
          EXPECTED_TARGET_COUNT: ${{ inputs.expected_target_count }}
          STYLE_GROUP_IDS: ${{ inputs.style_group_ids }}
          EXPECTED_SHA: ${{ inputs.deployed_sha }}
          MANIFEST_SHA: ${{ inputs.expected_manifest_sha256 }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == login_batch_initialize ]]; then
            ssh production "timeout 1800 docker exec -i \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_MODE='${MODE}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_LOGIN_BATCH_IDS='${LOGIN_BATCH_IDS}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_CREATED_ONLY_BATCH_IDS='${CREATED_ONLY_BATCH_IDS}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_EXPECTED_TARGET_COUNT='${EXPECTED_TARGET_COUNT}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_STYLE_GROUP_IDS='${STYLE_GROUP_IDS}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_SEED='${SEED}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_DEPLOYED_SHA='${EXPECTED_SHA}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_EXPECTED_SHA256='${MANIFEST_SHA}' \
              -e ACCOUNT_LOGIN_BATCH_PROFILE_INIT_APPROVAL_REF='${APPROVAL_REF}' \
              tgyunying-backend python -" \
              < .github/scripts/account_login_batch_profile_initialize.py
            exit 0
          fi
          if [[ "${OPERATION}" == profile_dedupe ]]; then
            ssh production "timeout 1800 docker exec -i \
              -e ACCOUNT_PROFILE_DEDUPE_MODE='${MODE}' \
              -e ACCOUNT_PROFILE_DEDUPE_SEED='${SEED}' \
              -e ACCOUNT_PROFILE_DEDUPE_EXPECTED_SHA256='${MANIFEST_SHA}' \
              -e ACCOUNT_PROFILE_DEDUPE_DEPLOYED_SHA='${EXPECTED_SHA}' \
              -e ACCOUNT_PROFILE_DEDUPE_APPROVAL_REF='${APPROVAL_REF}' \
              tgyunying-backend python -" \
              < .github/scripts/account_profile_duplicate_reconcile.py
            exit 0
          fi
          ssh production "timeout 1800 docker exec -i \
            -e AVATAR_MATERIAL_IMPORT_MODE='${MODE}' \
            -e AVATAR_MATERIAL_IMPORT_EXPECTED_SHA256='${MANIFEST_SHA}' \
            -e AVATAR_MATERIAL_IMPORT_DEPLOYED_SHA='${EXPECTED_SHA}' \
            -e AVATAR_MATERIAL_IMPORT_APPROVAL_REF='${APPROVAL_REF}' \
            tgyunying-backend python -" \
            < .github/scripts/account_avatar_material_import.py
