name: Production AI Dispatch Diagnostics

'on':
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full or short SHA expected in the current production release
        required: true
        type: string
      run_rescue:
        description: Run rescue on Tianjin Music and Zhengda tasks
        required: false
        default: false
        type: boolean
      update_targets:
        description: Update all group daily targets to 4200 per group
        required: false
        default: false
        type: boolean
      expand_all:
        description: Expand action plans for all running group tasks
        required: false
        default: false
        type: boolean
      run_speedup:
        description: Execute full pacing speedup, Zhengda rescue and Tianjin unblock
        required: false
        default: false
        type: boolean
      resume_comments:
        description: Run channel comment recovery and alignment (preview by default)
        required: false
        default: false
        type: boolean
      apply_comments:
        description: Apply channel comment recovery (true for apply, false for preview)
        required: false
        default: false
        type: boolean
      update_channel_views:
        description: Update channel view active window to 7 days, 24h random distribution, and replan
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production-silicon-valley
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          EXPECTED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{8,40}$ ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host silicon-valley-production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${SSH_CONNECT_TIMEOUT:-60}
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify release and run diagnostics
        env:
          PRODUCTION_BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          RUN_RESCUE: ${{ inputs.run_rescue }}
          UPDATE_TARGETS: ${{ inputs.update_targets }}
          EXPAND_ALL: ${{ inputs.expand_all }}
          RUN_SPEEDUP: ${{ inputs.run_speedup }}
          RESUME_COMMENTS: ${{ inputs.resume_comments }}
          APPLY_COMMENTS: ${{ inputs.apply_comments }}
          UPDATE_CHANNEL_VIEWS: ${{ inputs.update_channel_views }}
        run: |
          set -euo pipefail
          set -x
          [[ "${EXPECTED_DEPLOYED_SHA}" =~ ^[0-9a-fA-F]{8,40}$ ]]
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tgyunying}"
          EXPECTED_SHORT="${EXPECTED_DEPLOYED_SHA:0:8}"
          CURRENT_RELEASE="$(ssh silicon-valley-production-server "readlink -f '${BASE_DIR}/current'")"
          echo "CURRENT_RELEASE=${CURRENT_RELEASE}"
          [[ "$(basename "${CURRENT_RELEASE}")" == *"${EXPECTED_SHORT}"* ]]
          if [ "${UPDATE_CHANNEL_VIEWS}" = "true" ]; then
            scp .github/scripts/production_update_channel_view_seven_days.py \
              silicon-valley-production-server:/tmp/production_update_channel_view_seven_days.py
            ssh silicon-valley-production-server \
              "docker cp /tmp/production_update_channel_view_seven_days.py tgyunying-backend:/tmp/production_update_channel_view_seven_days.py && \
               docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/production_update_channel_view_seven_days.py"
            scp .github/scripts/production_inspect_channel_view_plan.py \
              silicon-valley-production-server:/tmp/production_inspect_channel_view_plan.py
            ssh silicon-valley-production-server \
              "docker cp /tmp/production_inspect_channel_view_plan.py tgyunying-backend:/tmp/production_inspect_channel_view_plan.py && \
               docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/production_inspect_channel_view_plan.py"
          fi
          if [ "${RESUME_COMMENTS}" = "true" ]; then
            MODE="preview"
            if [ "${APPLY_COMMENTS}" = "true" ]; then
              MODE="apply"
            fi
            scp .github/scripts/resume_and_align_channel_comment_tasks.py \
              silicon-valley-production-server:/tmp/resume_and_align_channel_comment_tasks.py
            ssh silicon-valley-production-server \
              "docker cp /tmp/resume_and_align_channel_comment_tasks.py tgyunying-backend:/tmp/resume_and_align_channel_comment_tasks.py && \
               docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/resume_and_align_channel_comment_tasks.py --mode ${MODE}"
          fi
          scp .github/scripts/production_diagnose_evening_stall.py \
            silicon-valley-production-server:/tmp/production_diagnose_evening_stall.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/production_diagnose_evening_stall.py tgyunying-backend:/tmp/production_diagnose_evening_stall.py && \
             docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/production_diagnose_evening_stall.py"
          scp .github/scripts/production_check_live_success.py \
            silicon-valley-production-server:/tmp/production_check_live_success.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/production_check_live_success.py tgyunying-backend:/tmp/production_check_live_success.py && \
             docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/production_check_live_success.py"
          scp .github/scripts/ai_dispatch_admission_diagnostics.py \
            silicon-valley-production-server:/tmp/ai_dispatch_admission_diagnostics.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/ai_dispatch_admission_diagnostics.py tgyunying-backend:/tmp/ai_dispatch_admission_diagnostics.py && \
             docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/ai_dispatch_admission_diagnostics.py"
          scp .github/scripts/inspect_task_account_counts.py \
            silicon-valley-production-server:/tmp/inspect_task_account_counts.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/inspect_task_account_counts.py tgyunying-backend:/tmp/inspect_task_account_counts.py && \
             docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/inspect_task_account_counts.py"
          scp .github/scripts/production_inspect_channel_view_plan.py \
            silicon-valley-production-server:/tmp/production_inspect_channel_view_plan.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/production_inspect_channel_view_plan.py tgyunying-backend:/tmp/production_inspect_channel_view_plan.py && \
             docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/production_inspect_channel_view_plan.py"
          scp .github/scripts/production_inspect_channel_comments.py \
            silicon-valley-production-server:/tmp/production_inspect_channel_comments.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/production_inspect_channel_comments.py tgyunying-backend:/tmp/production_inspect_channel_comments.py && \
             docker exec -w /app -e PYTHONPATH=/app tgyunying-backend python /tmp/production_inspect_channel_comments.py"
