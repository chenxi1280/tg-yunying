name: Production AI Generation Contract Coverage Recovery

'on':
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full or short SHA expected in production
        required: true
        type: string
      task_ids:
        description: Exact comma-separated current group_ai_chat task UUIDs
        required: true
        type: string
      apply:
        description: Apply only after a matching preview
        required: true
        default: false
        type: boolean
      expected_state_hash:
        description: Exact preview hash required for apply
        required: false
        default: ''
        type: string
      actor:
        description: Approved operator identity
        required: true
        default: codex-production-recovery
        type: string
      approval_ref:
        description: Approval or incident reference
        required: true
        type: string

concurrency:
  group: production-ai-generation-contract-coverage-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production-silicon-valley
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          EXPECTED_SHA: ${{ inputs.deployed_sha }}
          TASK_IDS: ${{ inputs.task_ids }}
          APPLY: ${{ inputs.apply }}
          STATE_HASH: ${{ inputs.expected_state_hash }}
          ACTOR: ${{ inputs.actor }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{8,40}$ ]]
          [[ "${TASK_IDS}" =~ ^[0-9a-fA-F-]{36}(,[0-9a-fA-F-]{36})*$ ]]
          [[ "${ACTOR}" =~ ^[A-Za-z0-9._@+-]{1,100}$ ]]
          [[ "${APPROVAL_REF}" =~ ^[A-Za-z0-9._:/#-]{1,160}$ ]]
          if [[ "${APPLY}" == true ]]; then
            [[ "${STATE_HASH}" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host silicon-valley-production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${SSH_CONNECT_TIMEOUT:-60}
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify deployed release and runtime
        env:
          BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          EXPECTED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          CURRENT_RELEASE="$(ssh silicon-valley-production-server "readlink -f '${BASE_DIR:-/data/tgyunying}/current'")"
          [[ "$(basename "${CURRENT_RELEASE}")" == *"${EXPECTED_SHA:0:8}"* ]]
          state="$(ssh silicon-valley-production-server 'docker inspect --format "{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" tgyunying-backend')"
          echo "AI_GENERATION_CONTRACT_RECOVERY_CONTAINER=tgyunying-backend:${state}"
          [[ "${state}" == running/healthy ]]

      - name: Preview or apply exact generation contract coverage recovery
        env:
          TASK_IDS: ${{ inputs.task_ids }}
          APPLY: ${{ inputs.apply }}
          STATE_HASH: ${{ inputs.expected_state_hash }}
          ACTOR: ${{ inputs.actor }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          scp backend/scripts/recover_ai_generation_contract_coverage.py \
            silicon-valley-production-server:/tmp/recover_ai_generation_contract_coverage.py
          ssh silicon-valley-production-server \
            "docker cp /tmp/recover_ai_generation_contract_coverage.py tgyunying-backend:/tmp/recover_ai_generation_contract_coverage.py && \
             docker exec \
               -e AI_GENERATION_CONTRACT_RECOVERY_TASK_IDS='${TASK_IDS}' \
               -e AI_GENERATION_CONTRACT_RECOVERY_BLOCKER_CODE='historical_backlog' \
               -e AI_GENERATION_CONTRACT_RECOVERY_APPLY='${APPLY}' \
               -e AI_GENERATION_CONTRACT_RECOVERY_EXPECTED_STATE_HASH='${STATE_HASH}' \
               -e AI_GENERATION_CONTRACT_RECOVERY_ACTOR='${ACTOR}' \
               -e AI_GENERATION_CONTRACT_RECOVERY_APPROVAL_REF='${APPROVAL_REF}' \
               tgyunying-backend python /tmp/recover_ai_generation_contract_coverage.py"
