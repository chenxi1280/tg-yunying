name: Production AI Group Target Tuning

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Expected production release SHA
        required: true
        type: string
      target:
        description: New daily message target
        required: true
        type: string
        default: "4200"
      apply:
        description: Apply changes to production database (default is false/preview)
        required: true
        type: boolean
        default: false
      switch_v2:
        description: Switch all running AI group tasks to AI Route V2 (default true)
        required: true
        type: boolean
        default: true

concurrency:
  group: production-ai-group-target-tuning
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tuning:
    runs-on: ubuntu-latest
    environment: production-silicon-valley
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target tuning inputs
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_DEPLOYED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${TARGET}" =~ ^[0-9]+$ ]]
          (( TARGET > 0 ))

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host silicon-valley-production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${SSH_CONNECT_TIMEOUT:-60}
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify deployed release without mutation
        env:
          PRODUCTION_BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tgyunying}"
          EXPECTED_SHORT_SHA="${EXPECTED_DEPLOYED_SHA:0:8}"
          CURRENT_RELEASE="$(ssh silicon-valley-production-server "readlink -f '${BASE_DIR}/current'")"
          CURRENT_NAME="$(basename "${CURRENT_RELEASE}")"
          case "${CURRENT_NAME}" in
            *_"${EXPECTED_SHORT_SHA}") ;;
            *) echo "deployed release SHA does not match requested SHA" >&2; exit 1 ;;
          esac

      - name: Run daily target tuning script
        env:
          TARGET: ${{ inputs.target }}
          APPLY: ${{ inputs.apply }}
          TASK_ID: ${{ inputs.task_id }}
          SWITCH_V2: ${{ inputs.switch_v2 }}
        run: |
          set -euo pipefail
          APPLY_FLAG=""
          if [[ "${APPLY}" == "true" ]]; then
            APPLY_FLAG="--apply"
          fi
          TASK_FLAG=""
          if [[ -n "${TASK_ID}" ]]; then
            TASK_FLAG="--task-id ${TASK_ID}"
          fi
          ssh silicon-valley-production-server "timeout 120 docker exec -i tgyunying-backend python - --target ${TARGET} ${APPLY_FLAG} ${TASK_FLAG}" \
            < backend/scripts/update_ai_group_daily_targets.py
          if [[ "${SWITCH_V2}" == "true" ]]; then
            echo "=== SWITCHING AI ROUTE V2 ==="
            ssh silicon-valley-production-server "timeout 120 docker exec -i tgyunying-backend python - ${APPLY_FLAG}" \
              < backend/scripts/enable_ai_route_v2_for_all_tasks.py
          fi
          echo "=== DIAGNOSE ZHENGZHOU DAXUE DEEP ==="
          ssh silicon-valley-production-server "timeout 60 docker exec -i tgyunying-backend python -" < backend/scripts/diagnose_zhengzhou_daxue_deep.py
          echo "=== QUERY TIANJIN GROUPS ==="
          ssh silicon-valley-production-server "timeout 60 docker exec -i tgyunying-backend python -" < backend/scripts/query_tianjin_group.py
          echo "=== DIAGNOSE TIANJIN RESCUE ==="
          ssh silicon-valley-production-server "timeout 60 docker exec -i tgyunying-backend python -" < backend/scripts/diagnose_tianjin_rescue.py
          echo "=== GENERATE AND BIND ADULT ATTESTATIONS ==="
          ssh silicon-valley-production-server "timeout 120 docker exec -i tgyunying-backend python - ${APPLY_FLAG}" < backend/scripts/generate_and_bind_adult_attestations.py
          echo "=== DIAGNOSE ZERO CONFIRMED TASKS ==="
          ssh silicon-valley-production-server "timeout 60 docker exec -i tgyunying-backend python -" < backend/scripts/diagnose_zero_confirmed_tasks.py
          echo "=== SYNC POLICY BINDINGS ==="
          ssh silicon-valley-production-server "timeout 120 docker exec -i tgyunying-backend python - ${APPLY_FLAG}" < backend/scripts/sync_ai_policy_bindings_from_loufeng.py
          echo "=== LOUFENG CONFIG QUERY ==="
          ssh silicon-valley-production-server "timeout 60 docker exec -i tgyunying-backend python -" < backend/scripts/query_loufeng_config.py
          echo "=== CHENGDU ERROR QUERY ==="
          ssh silicon-valley-production-server "timeout 60 docker exec -i tgyunying-backend python -" < backend/scripts/query_chengdu_errors.py
          echo "=== EXACT PRODUCTION RUNTIME FACTS ==="
          ssh silicon-valley-production-server '
            echo "HOST_CURRENT_RELEASE_SYMLINK: $(readlink -f /data/tgyunying/current)"
            echo "BACKEND_CONTAINER_IMAGE: $(docker inspect tgyunying-backend --format "{{.Config.Image}}")"
            echo "RUNNING_CONTAINERS:"
            docker ps --format "{{.Names}} -> {{.Image}} ({{.Status}})" | grep tgyunying
          '
